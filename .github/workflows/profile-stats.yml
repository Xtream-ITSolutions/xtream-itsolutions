name: Generate Profile Stats

# Eigene, ausfallsichere Kennzahlen-Grafik (ohne externe Statistikdienste).
# Erzeugt profile-stats.svg im `output`-Branch (analog zur Snake-Animation).

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/profile_stats.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Skript von main auschecken
        uses: actions/checkout@v4
        with:
          path: main

      - name: Output-Branch auschecken
        uses: actions/checkout@v4
        with:
          ref: output
          path: output

      - name: Kennzahlen-SVG erzeugen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd output
          GH_TOKEN="$GH_TOKEN" python3 ../main/.github/scripts/profile_stats.py --out profile-stats.svg || true

      - name: Aenderung committen und pushen
        run: |
          cd output
          if [ ! -f profile-stats.svg ]; then echo "Kein SVG vorhanden, nichts zu tun."; exit 0; fi
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('profile-stats.svg'); print('SVG ok')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-stats.svg
          git diff --cached --quiet || (git commit -m "chore: Profil-Statistiken aktualisieren" && git push)
